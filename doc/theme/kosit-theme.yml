extends:
  - default-with-fallback-font
running-content:
  start-at: body
title-page:
  align: left
page:
  margin: [0.75in, 1in, 0.75in, 1in]
base:
  line-height-length: 20
heading:
  #font-color: #FF8000
  font-size: 12
  line-height: 1.2
#link:
  #font-color: #009900
footer:
  height: 0.75in
  line-height: 1
  recto: &shared_footer
    left: 
      content: 'Copyright © 2021-{docyear} Koordinierungsstelle für IT-Standards (KoSIT) | https://www.xoev.de/[https://www.xoev.de]'
    right:
      content: '*{page-number}*'
  verso: *shared_footer
caption:
  align: left
  # font-color: #FF0000
  font-size: 10